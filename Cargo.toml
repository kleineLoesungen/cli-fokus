[package]
name = "focus"
version = "0.2.2"
edition = "2024"
description = "Was ist heute dran? Aufgaben nach dringend und wichtig, im Terminal."
license = "GPL-3.0-or-later"
repository = "https://github.com/kleineLoesungen/cli-focus"
homepage = "https://github.com/kleineLoesungen/cli-focus"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossterm = "0.29.0"
unicode-width = "0.2.3"

# Für die fertigen Programme im Release (dist).
[profile.dist]
inherits = "release"
lto = "thin"
