[workspace]
members = ["cargo:."]

# Einstellungen für `dist` (cargo-dist): baut bei einem Versions-Tag die
# Programme, legt ein GitHub-Release an und aktualisiert die Homebrew-Formel.
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "homebrew"]
tap = "kleineLoesungen/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# Das Skript installiert nach ~/.cargo/bin, wo Fokus auch mit cargo landet.
install-path = "CARGO_HOME"
install-updater = false
